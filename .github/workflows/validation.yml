name: Product Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm --prefix functions ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm --prefix functions audit --audit-level=moderate
      - run: npm exec --yes --package=firebase-tools@15.14.0 -- firebase emulators:exec --only firestore,auth --project demo-su-voz-stability "node scripts/run-tests.mjs --emulator"
      - run: git diff --exit-code
