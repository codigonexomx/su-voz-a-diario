<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Verificación local de navegación</title>
<style>html,body{margin:0;height:100%;font:13px system-ui}iframe{width:100%;height:100%;border:0;display:block}aside{position:fixed;top:70px;right:12px;max-width:370px;background:#fffef5;color:#172033;padding:12px;border:1px solid #bbb;border-radius:12px;box-shadow:0 4px 20px #0003;z-index:9999}pre{max-height:220px;overflow:auto;white-space:pre-wrap;font-size:11px}button{padding:8px;margin:2px;cursor:pointer}</style>
<iframe title="Su Voz local" src="../index.html"></iframe>
<aside><b>QA local · no se incluye en el paquete</b><br><button id="run">Recorrer cinco secciones</button><button id="inspect">Pausar gota en movimiento</button><button id="hide">Ocultar resultados</button><pre id="result">Listo para probar.</pre></aside>
<script>
const frame = document.querySelector('iframe'), result = document.querySelector('#result');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
document.querySelector('#inspect').onclick = async () => {
    const w = frame.contentWindow, d = frame.contentDocument;
    d.getElementById('nav-home').click(); await wait(1000);
    d.getElementById('nav-stats').click(); await wait(120);
    w.cancelAnimationFrame(w.App._glassNavAnimationFrame);
    w.App._glassNavAnimationFrame = null;
    result.textContent = 'Muestra detenida a los 120 ms. Recarga para volver a la navegación normal.';
};
document.querySelector('#hide').onclick = () => document.querySelector('aside').hidden = true;
document.querySelector('#run').onclick = async () => {
    const button = document.querySelector('#run'); button.disabled = true;
    const results = [];
    try {
        for (const id of ['nav-home','nav-bible','nav-calendar','nav-community','nav-stats']) {
            const d = frame.contentDocument, w = frame.contentWindow, b = d.getElementById(id);
            let sampling = true, peakLiquid = 0, contained = true;
            const sample = () => {
                const nav = d.querySelector('.bottom-nav'), lens = nav.querySelector('.nav-glass-indicator');
                const nr = nav.getBoundingClientRect(), lr = lens.getBoundingClientRect();
                peakLiquid = Math.max(peakLiquid, parseFloat(w.getComputedStyle(nav).getPropertyValue('--nav-water-energy')) || 0);
                contained &&= lr.left >= nr.left - 1 && lr.right <= nr.right + 1;
                for (const dot of lens.querySelectorAll('[data-water-tail], [data-water-drop]')) {
                    if (Number(dot.getAttribute('r')) > 0.1) {
                        const sr = lens.querySelector('svg').getBoundingClientRect();
                        const cx = Number(dot.getAttribute('cx')), radius = Number(dot.getAttribute('r'));
                        contained &&= sr.left + (cx-radius)*sr.width/140 >= nr.left && sr.left + (cx+radius)*sr.width/140 <= nr.right;
                    }
                }
                if (sampling) w.requestAnimationFrame(sample);
            };
            b.click(); w.requestAnimationFrame(sample); await wait(1200); sampling = false;
            const n = d.querySelector('.bottom-nav'), r = n.getBoundingClientRect();
            const i = n.querySelector('.nav-glass-indicator').getBoundingClientRect(), a = n.querySelector('.active').getBoundingClientRect();
            results.push({id,peakLiquid,contained,route:w.location.hash,top:r.top,bottom:r.bottom,viewport:w.innerHeight,overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,centerError:+(i.x+i.width/2-a.x-a.width/2).toFixed(2),visible:w.getComputedStyle(n).visibility});
            result.textContent = JSON.stringify(results,null,2);
        }
        const stable = Math.max(...results.map(r=>r.top))-Math.min(...results.map(r=>r.top))<1;
        const passed = stable && results.every(r=>r.overflow===0 && Math.abs(r.centerError)<1 && r.visible==='visible' && r.contained);
        result.textContent = JSON.stringify({passed,stable,results},null,2);
    } catch(e) {result.textContent = String(e.stack || e);} finally {button.disabled=false;}
};
</script></html>
