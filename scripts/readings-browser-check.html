<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Verificación local de lecturas octubre–diciembre</title>
<style>body{font:16px system-ui;margin:20px}iframe{width:390px;height:844px;border:1px solid #aaa}pre{white-space:pre-wrap}button{padding:12px}</style>
<h1>Verificación local de lecturas</h1>
<p>Comprueba las lecturas y preguntas sin publicar respuestas ni modificar avances. No se incluye en Android.</p>
<button id="run">Probar 92 lecturas y tres versiones</button>
<pre id="result">Listo para probar.</pre>
<iframe title="Su Voz en tamaño móvil" src="../index.html?qa=q4-238#reading/2026-10-01"></iframe>
<script type="module">
const frame=document.querySelector('iframe'), output=document.querySelector('#result');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(ok,label)=>{if(!ok)throw new Error(label)};
const normalize=text=>text.replace(/\s+/gu,'').replace(/[\u200B-\u200D\uFEFF]/gu,'');
document.querySelector('#run').onclick=async()=>{
 const report={status:'running',readings:0,versions:0,calendar:0,boundaries:[],fallback:false,historicalTexts:0,parserCases:0,overflow:[]};
 let app, originalVersion,originalToday;
 output.textContent='Prueba en ejecución…';
 try {
  const w=frame.contentWindow,d=frame.contentDocument;
  for(let i=0;i<150&&!w.App?.data?.length;i++)await wait(100);
  app=w.App;assert(app?.data?.length,'La aplicación no terminó de cargar.');
  originalVersion=app.currentVersion;originalToday=app.getTodayDateStr;
  const approved=await (await fetch('../docs/preguntas-aprobadas-octubre-diciembre-2026.json')).json();
  const proposed=await (await fetch('../docs/preguntas-propuestas-hageo-2026.json')).json();
  const questions=[...approved,...proposed].sort((a,b)=>a.date.localeCompare(b.date));
  assert(questions.length===92,'El trimestre debe contener 92 preguntas.');
  await app.loadReadingIndex();
  // Render every day in the actual application, including the daily home layout.
  for(const q of questions){
   const reading=await app.getReadingByDate(q.date);
   assert(reading?.reference===q.reference,`${q.date}: referencia`);
   app.getTodayDateStr=()=>q.date;
   await app.renderReading(q.date);
   assert(d.querySelector('.daily-question-text')?.textContent===q.dailyQuestion,`${q.date}: pregunta visible`);
   const response=d.querySelector('[data-action="respond-daily-question"]');
   assert(response?.dataset.date===q.date&&response?.dataset.reference===q.reference,`${q.date}: vínculo respuesta`);
   assert(app.getCommunityTodayContext().dailyQuestion===q.dailyQuestion,`${q.date}: contexto comunidad`);
   for(const version of ['rvr60','ntv','tla']){
    await app.handleDailyVersionChange(version);
    const source=d.createElement('div');source.innerHTML=reading.versions[version];
    const actual=d.querySelector('.reading-text');
    assert(normalize(actual.textContent)===normalize(source.textContent),`${q.date}/${version}: texto renderizado diferente`);
    assert(d.querySelector(`[data-version="${version}"]`)?.getAttribute('aria-pressed')==='true',`${q.date}/${version}: selección`);
    assert(d.querySelector('.daily-question-text')?.textContent===q.dailyQuestion,`${q.date}/${version}: pregunta cambió`);
    assert(actual.querySelectorAll('.verse-item').length===source.querySelectorAll('sup').length,`${q.date}/${version}: número de versículos`);
    report.versions++;
   }
   if(d.documentElement.scrollWidth>w.innerWidth+1)report.overflow.push(q.date);
   report.readings++;
  }
  app.getTodayDateStr=originalToday;
  for(const reading of app.data.filter(r=>r.date<'2026-10-01')){
   for(const html of Object.values(reading.versions||{})){
    const source=d.createElement('div'), rendered=d.createElement('div');
    source.innerHTML=html;rendered.innerHTML=app.renderVerseText(html,reading.date);
    rendered.querySelectorAll('.verse-note-icon').forEach(node=>node.remove());
    assert(normalize(rendered.textContent)===normalize(source.textContent),`${reading.date}: regresión de texto anterior`);
    report.historicalTexts++;
   }
  }
  for(const html of [
   '<p><sup>4</sup> Fueron sellados 144.000 de Israel.</p><p><sup>5</sup> De Judá, 12.000; de Rubén, 12.000.</p>',
   '<p><sup>58</sup> Fin de capítulo.</p><p><sup>1</sup> Nuevo capítulo con 2220 kilómetros.</p>',
   '<p><span class="v">1</span> Una cifra 10 y otra 20.</p><p><span data-verse="2">2</span> Texto &lt;literal&gt; &amp; fiel.</p>'
  ]){
   const source=d.createElement('div'),rendered=d.createElement('div');
   source.innerHTML=html;rendered.innerHTML=app.renderVerseText(html,'qa-parser');
   assert(normalize(source.textContent)===normalize(rendered.textContent),'Regresión: números, capítulo o caracteres especiales.');
   assert(rendered.querySelectorAll('.verse-item').length===2,'Regresión: conteo de versículos.');
   report.parserCases++;
  }
  for(const q of questions){
   app.calendarV2ActiveMonth=q.date.slice(0,7);app.calendarV2SelectedDate=q.date;
   app.renderCalendar();
   assert(d.querySelector(`[data-action="calendar-v2-select-day"][data-date="${q.date}"]`),`${q.date}: celda calendario`);
   assert(d.querySelector(`[data-nav="reading"][data-param="${q.date}"]`),`${q.date}: abrir desde calendario`);
   report.calendar++;
  }
  for(const [from,to] of [['2026-09-30','2026-10-01'],['2026-10-31','2026-11-01'],['2026-11-30','2026-12-01'],['2026-12-23','2026-12-24'],['2026-12-24','2026-12-25'],['2026-12-25','2026-12-26'],['2026-12-26','2026-12-27']]){
   await app.renderReading(from);await app.changeHomeDay(1);
   assert(app.getHomeViewingDate()===to,`${from}: siguiente`);
   assert(d.querySelector('.reading-text-shell')?.dataset.readingDate===to,`${to}: destino`);
   await app.changeHomeDay(-1);assert(app.getHomeViewingDate()===from,`${to}: anterior`);
   report.boundaries.push(`${from} ↔ ${to}`);
  }
  // Exercise real fallback while monthly loading is deliberately unavailable.
  const load=app.loadMonthlyReadings;
  try{
   app.loadMonthlyReadings=async()=>{throw new Error('QA: archivo mensual no disponible')};
   for(const q of questions)assert((await app.getReadingByDate(q.date))?.dailyQuestion===q.dailyQuestion,`${q.date}: respaldo`);
   report.fallback=true;
  }finally{app.loadMonthlyReadings=load;}
  assert(report.overflow.length===0,'Desbordamiento horizontal: '+report.overflow.join(', '));
  report.status='passed';
 }catch(error){report.status='failed';report.error=error.message;}
 finally{
  if(app&&originalToday){app.getTodayDateStr=originalToday;app.currentVersion=originalVersion;frame.contentWindow.localStorage.setItem('current-version',originalVersion);await app.renderReading('2026-12-24');}
  output.textContent=JSON.stringify(report,null,2);
 }
};
</script>
</html>
